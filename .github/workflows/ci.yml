name: Continuous Integration

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: payroll_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/payroll_test" >> $GITHUB_ENV
        echo "NODE_ENV=test" >> $GITHUB_ENV
        echo "SESSION_SECRET=test-session-secret-key-for-ci-only-not-for-production" >> $GITHUB_ENV
        echo "DATA_ENCRYPTION_KEY=test-encryption-key-for-ci-only-32char" >> $GITHUB_ENV

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Run database migrations
      run: npm run db:push
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payroll_test

    - name: Run TypeScript type checking
      run: npm run check

    - name: Run ESLint
      run: npm run lint
      continue-on-error: false

    - name: Run unit tests
      run: npm run test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payroll_test

    - name: Run tests with coverage
      run: npm run test:coverage
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payroll_test

    - name: Upload coverage to Codecov
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Build application
      run: npm run build

    - name: Test build output
      run: |
        if [ ! -f "dist/index.js" ]; then
          echo "Build failed: dist/index.js not found"
          exit 1
        fi
        echo "Build successful: dist/index.js created"

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level moderate

    - name: Run security scan
      run: |
        # Check for common security issues in the codebase
        if grep -r "password.*=" . --include="*.ts" --include="*.js" --exclude-dir=node_modules --exclude-dir=.git; then
          echo "⚠️  Potential hardcoded passwords found"
          exit 1
        fi
        
        if grep -r "secret.*=" . --include="*.ts" --include="*.js" --exclude-dir=node_modules --exclude-dir=.git --exclude=".github/workflows/ci.yml"; then
          echo "⚠️  Potential hardcoded secrets found"
          exit 1
        fi
        
        echo "✅ Basic security scan passed"

  schema-validation:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: payroll_schema_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup test database
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/payroll_schema_test" >> $GITHUB_ENV
        echo "NODE_ENV=test" >> $GITHUB_ENV
        echo "SESSION_SECRET=test-session-secret" >> $GITHUB_ENV
        echo "DATA_ENCRYPTION_KEY=test-encryption-key-for-ci-only-32char" >> $GITHUB_ENV

    - name: Run schema migration tests
      run: npm test tests/schema-migration.test.ts
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payroll_schema_test

  performance-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: payroll_perf_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup performance test environment
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/payroll_perf_test" >> $GITHUB_ENV
        echo "NODE_ENV=test" >> $GITHUB_ENV
        echo "SESSION_SECRET=test-session-secret" >> $GITHUB_ENV
        echo "DATA_ENCRYPTION_KEY=test-encryption-key-for-ci-only-32char" >> $GITHUB_ENV

    - name: Run database setup
      run: npm run db:push
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payroll_perf_test

    - name: Run performance regression tests
      run: npm test tests/payroll-regression.test.ts --verbose
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payroll_perf_test

    - name: Performance benchmark
      run: |
        echo "🚀 Running performance benchmarks..."
        # Run the regression test and capture timing
        time npm test tests/payroll-regression.test.ts --silent > perf_results.txt 2>&1 || true
        
        # Check if any tests took too long
        if grep -q "timeout" perf_results.txt; then
          echo "❌ Performance regression detected: Tests timing out"
          exit 1
        fi
        
        echo "✅ Performance tests completed within acceptable limits"

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check TypeScript strict mode compliance
      run: |
        echo "🔍 Checking TypeScript configuration..."
        if ! grep -q '"strict": true' tsconfig.json; then
          echo "❌ TypeScript strict mode not enabled"
          exit 1
        fi
        
        if ! grep -q '"noImplicitAny": true' tsconfig.json; then
          echo "❌ noImplicitAny not enabled"
          exit 1
        fi
        
        echo "✅ TypeScript strict mode enabled"

    - name: Validate test coverage requirements
      run: |
        echo "📊 Checking test coverage configuration..."
        if ! grep -q '"branches": 80' jest.config.js; then
          echo "❌ Branch coverage threshold not set to 80%"
          exit 1
        fi
        
        if ! grep -q '"functions": 80' jest.config.js; then
          echo "❌ Function coverage threshold not set to 80%"
          exit 1
        fi
        
        echo "✅ Coverage thresholds properly configured"

    - name: Check for critical test files
      run: |
        echo "🧪 Validating required test files..."
        
        if [ ! -f "tests/schema-migration.test.ts" ]; then
          echo "❌ Schema migration tests missing"
          exit 1
        fi
        
        if [ ! -f "tests/units/PayrollEngine.test.ts" ]; then
          echo "❌ PayrollEngine unit tests missing"
          exit 1
        fi
        
        if [ ! -f "tests/units/complianceGuardrails.test.ts" ]; then
          echo "❌ Compliance guardrails tests missing"
          exit 1
        fi
        
        if [ ! -f "tests/units/overtimePreventionEngine.test.ts" ]; then
          echo "❌ Overtime prevention engine tests missing"
          exit 1
        fi
        
        echo "✅ All critical test files present"

    - name: Validate code complexity
      run: |
        echo "🔧 Running code complexity analysis..."
        
        # Check for overly complex functions (simplified check)
        if find . -name "*.ts" -not -path "./node_modules/*" -not -path "./.git/*" -exec grep -l "if.*if.*if.*if.*if" {} \; | wc -l | grep -q "^[1-9]"; then
          echo "⚠️  Warning: Some functions may be overly complex"
        fi
        
        # Check for very long files (>1000 lines)
        long_files=$(find . -name "*.ts" -not -path "./node_modules/*" -not -path "./.git/*" -exec wc -l {} \; | awk '$1 > 1000 {print $2}')
        if [ ! -z "$long_files" ]; then
          echo "⚠️  Warning: Large files found (>1000 lines):"
          echo "$long_files"
        fi
        
        echo "✅ Code complexity analysis completed"

  deployment-readiness:
    runs-on: ubuntu-latest
    needs: [quality-assurance, security-audit, schema-validation]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build for production
      run: npm run build
      env:
        NODE_ENV: production

    - name: Validate production build
      run: |
        echo "🚀 Validating production build..."
        
        if [ ! -f "dist/index.js" ]; then
          echo "❌ Production build failed: main file missing"
          exit 1
        fi
        
        # Check build size
        build_size=$(du -h dist/index.js | cut -f1)
        echo "📦 Production build size: $build_size"
        
        # Check for development dependencies in production build
        if grep -q "development" dist/index.js; then
          echo "⚠️  Warning: Development references found in production build"
        fi
        
        echo "✅ Production build validation completed"

    - name: Generate deployment report
      run: |
        echo "# Deployment Readiness Report" > deployment-report.md
        echo "Generated: $(date)" >> deployment-report.md
        echo "" >> deployment-report.md
        echo "## Quality Checks" >> deployment-report.md
        echo "- ✅ TypeScript compilation" >> deployment-report.md
        echo "- ✅ ESLint validation" >> deployment-report.md
        echo "- ✅ Unit test coverage (80%+)" >> deployment-report.md
        echo "- ✅ Schema migration tests" >> deployment-report.md
        echo "- ✅ Security audit" >> deployment-report.md
        echo "- ✅ Performance regression tests" >> deployment-report.md
        echo "" >> deployment-report.md
        echo "## Build Information" >> deployment-report.md
        echo "- Node.js Version: $(node --version)" >> deployment-report.md
        echo "- Build Size: $(du -h dist/index.js | cut -f1)" >> deployment-report.md
        echo "- Commit: ${{ github.sha }}" >> deployment-report.md
        
        cat deployment-report.md

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: production-build
        path: |
          dist/
          deployment-report.md
        retention-days: 7